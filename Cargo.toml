[workspace]
resolver = "2"
members = ["polaris-cli", "polaris-core"]

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
# Shared dependency versions
anyhow = "1"
# One pin for both crates: two literal versions could drift into two
# bundled SQLite builds linked into the same binary.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
